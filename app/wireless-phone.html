<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>P-12 Phone MIDI</title>
<style>body{margin:0;background:#181b1f;color:#eee;font:16px system-ui;padding:16px}h1{font-size:22px}button,input,select{font:inherit;padding:12px;border-radius:7px;border:1px solid #707070}button{background:#33373e;color:#fff}button:active,.down{background:#db9028!important}label{display:block;margin:12px 0}#pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}#pads button{height:110px;touch-action:none;background:#363b41;border-top:5px solid #d99c45;user-select:none;-webkit-user-select:none}#status{min-height:28px;color:#e7b65a}.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}#code{width:110px}small{color:#b3b9c1}</style>
<h1>P-12 · Phone MIDI</h1><div class="row"><details><summary>Advanced</summary><input id="code" inputmode="numeric" maxlength="6" placeholder="PC code" aria-label="Pairing code"></details><button id="connect">Connect</button><button id="disconnect">Disconnect</button></div><p id="status">Connect and approve this phone on desktop P-12.</p>
<div class="row"><label>Bank <select id="bank"><option>A</option><option>B</option><option>C</option><option>D</option></select></label><label>Channel <select id="channel"></select></label><label>Velocity <input id="velocity" type="range" min="1" max="127" value="100"></label></div>
<div id="pads"></div><label><input id="transport" type="checkbox"> Send Start/Stop (also enable Receive Start/Stop on PC)</label><div class="row"><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="panic">All notes off</button></div><small>Same Wi-Fi or phone hotspot. MIDI only; the PC plays its loaded sounds. No project/audio transfer. Keep this page in the foreground.</small>
<script src="p12-wireless-client.js"></script><script>
const $=id=>document.getElementById(id),maps={A:[60,61,62,63,64,65,66,67],B:[42,44,46,49,51,54,56,58],C:[47,48,50,52,53,55,57,59],D:[36,38,40,41,43,45,39,37]},held=new Map();
const client=new P12WirelessClient({onState:s=>$('status').textContent=s,onMidi:()=>{},onDisconnect:()=>{held.clear();document.querySelectorAll('.down').forEach(e=>e.classList.remove('down'));}});
for(let i=1;i<=16;i++)$('channel').add(new Option(i,i-1));
$('connect').onclick=async()=>{try{if($('code').value){client.disconnect();client.connect(location.origin,$('code').value);}else{const d=await fetch('/device-info').then(r=>r.json());client.connectDevice({...d,address:location.origin});}}catch(e){$('status').textContent=e.message;}};$('disconnect').onclick=()=>client.disconnect();
function release(id){const p=held.get(id);if(!p)return;held.delete(id);client.send([0x80|p.ch,p.note,0]);p.button.classList.remove('down');}
for(let i=0;i<8;i++){const b=document.createElement('button');b.textContent='PAD '+(i+1);b.onpointerdown=e=>{e.preventDefault();if(!client.connected)return;const p={note:maps[$('bank').value][i],ch:Number($('channel').value),button:b};held.set(e.pointerId,p);b.setPointerCapture(e.pointerId);b.classList.add('down');client.send([0x90|p.ch,p.note,Number($('velocity').value)]);};b.onpointerup=e=>release(e.pointerId);b.onpointercancel=e=>release(e.pointerId);b.onlostpointercapture=e=>release(e.pointerId);$('pads').appendChild(b);}
function panic(){for(const id of [...held.keys()])release(id);for(let ch=0;ch<16;ch++)client.send([0xb0|ch,123,0]);}
$('panic').onclick=panic;document.addEventListener('visibilitychange',()=>{if(document.hidden)panic();});window.addEventListener('pagehide',()=>{panic();client.disconnect();});
$('play').onclick=()=>{if($('transport').checked)client.send([0xfa]);};$('stop').onclick=()=>{if($('transport').checked)client.send([0xfc]);panic();};
</script></html>
